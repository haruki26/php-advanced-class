services:
  app:
    build:
      context: .
      dockerfile: ./docker/app/Dockerfile
      args:
        USERNAME: vscode
        USER_UID: "1000"
        USER_GID: "1000"
    volumes:
      - .:/workspace:cached
    command: sleep infinity
    depends_on:
      - mysql
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: secret
    networks:
      - devnet

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/conf/my.cnf:/etc/mysql/my.cnf
    networks:
      - devnet

networks:
  devnet:
    driver: bridge
